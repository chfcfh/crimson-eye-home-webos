# Every push to the dev branch builds the package and publishes it as the PRE-release named dev (replacing the one before).
# The manager app on the TV can follow it (Update channel > Dev builds); "latest" and the stable updater never see it.
# The daily release (release.yml) starts this too, so dev carries the new version numbers after a release.
name: Dev build
on:
  push:
    branches: [dev]
    paths-ignore:   # a documentation-only push does not need a dev build
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
concurrency:
  group: dev-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Node 8 and the old Chromium builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/cleanyourtv
          key: cytv-engines-${{ runner.os }}-node8.12.0-chromium555668-706915
      - name: Libraries the old Chromium builds need
        run: |
          sudo apt-get update -qq
          for p in libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0t64 libxss1 libxtst6 fonts-liberation; do sudo apt-get install -y -qq $p >/dev/null 2>&1 || echo "not installed: $p"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Development tools (type checks, lint, formatting)
        run: npm ci --no-audit --no-fund
      - name: Checks (tests under Node 8.12.0, what webOS 5 and 6 ship, and the current Node; pages up to date)
        run: CYTV_SHOTS=$RUNNER_TEMP/shots sh tools/check.sh --chromium
      - name: Screenshots of the pages in Chromium 68 and 79
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-chromium-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: Build the package
        run: CYTV_BUILD="${GITHUB_SHA::7}" CYTV_REPO="$GITHUB_REPOSITORY" CYTV_TAG=dev python3 ipk/build.py
      - name: Publish the dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s)
          svc=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" helper/helper.js | head -1)
          printf 'build: %s\nbranch: dev\n\nDev build (service %s): every change on the dev branch, before it goes into the daily release. It can be less finished.\nLast commit: %s\n' \
            "${GITHUB_SHA::7}" "$svc" "$subject" > notes.txt
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev --prerelease --latest=false --target "$GITHUB_SHA" --title "Dev build" --notes-file notes.txt dist/*
